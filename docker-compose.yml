services:
  mysql:
    image: mysql:8.4
    container_name: language-flow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: language_flow
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udev", "-pdev"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: language-flow-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: mysql://dev:dev@mysql:3306/language_flow
      DB_HOST: mysql
      DB_PORT: 3306
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # LLM（Ollama）：默认连宿主机 11434，可用环境变量覆盖
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      RENDER_TEMP_DIR: /tmp/language-flow-render
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 宿主机侧 uploads 目录（Finder 定位视频用，与绑定挂载同一路径）
      HOST_UPLOADS_DIR: ${HOME}/language-flow-uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/language-flow-uploads:/app/packages/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: language-flow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
