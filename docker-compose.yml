# ── 生产栈（老版本常驻）──
# 版本锁定模型（2026-09-21）：本文件没有 build 段 —— 生产永远跑 deploy/prod.env 里
# APP_VERSION 指向的固定 tag 镜像，工作树改动 / pnpm docker:test 重新构建都影响不到它。
# 升级只能经 scripts/stack.sh release（构建 → 打 tag → 写 APP_VERSION → up -d），回滚改版本号。
# 所有子命令必须带 --env-file deploy/prod.env（stack.sh 已内置），不要裸跑 docker compose。
services:
  mysql:
    image: mysql:8.4
    container_name: language-flow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: language_flow
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      # 仅绑回环（与测试栈 :3307 同口径，审查批次 2A）：局域网对端不得直连生产库，
      # 栈内 backend 经服务名 mysql:3306 访问不受影响
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      default:
        aliases:
          - mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udev", "-pdev"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: language-flow-ai-backend:${APP_VERSION}
    container_name: language-flow-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      # 容器内跨容器访问需全网卡绑定（宿主侧不映射 8080，暴露面仍只有 nginx）；新版镜像代码默认 127.0.0.1
      HOST: 0.0.0.0
      # 不设 NODE_ENV=production：限流开启时为「全端点共享 100/min」，仅 /api/dashboard/summary
      # 有只读豁免（v171d1d6 起含）；单用户本地平台按配置层关闭限流，升级后仍应显式保持关闭
      DATABASE_URL: mysql://dev:dev@mysql:3306/language_flow
      DB_HOST: mysql
      DB_PORT: 3306
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:15173}
      # LLM（Ollama）：默认连宿主机 11434，可用环境变量覆盖
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      RENDER_TEMP_DIR: /tmp/language-flow-render
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 宿主机侧 uploads 目录（Finder 定位视频用，与绑定挂载同一路径）
      HOST_UPLOADS_DIR: ${HOME}/language-flow-uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/language-flow-uploads:/app/packages/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy
    # 不映射宿主 8080：宿主 8080/5173 归本地 pnpm dev 独占，避免浏览器 localhost 双解析
    # 把新 UI 的请求打到老后端（404 + 限流击穿）；生产 API 只经 frontend nginx 同源反代

  frontend:
    image: language-flow-ai-frontend:${APP_VERSION}
    container_name: language-flow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${PROD_UI_PORT}:80"

volumes:
  mysql_data:

# 固定网络名，避免 docker start 后掉网、backend 解析不到主机名 mysql
networks:
  default:
    name: language-flow-ai_default
