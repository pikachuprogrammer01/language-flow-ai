# lefthook.yml — Git hooks 自动化配置
# 文档: https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: false
  commands:
    biome:
      glob: "*.{ts,vue,json,yaml,yml,md}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
      skip:
        - merge
        - rebase
    # API 文档随提交自动更新（docs/16）：backend 源码有变更时重生成 openapi.json 并补 stage，
    # 同时跑覆盖度/规范门禁（裸 Hono 端点、缺 summary/tags/operationId、路径命名违规均拒绝提交）
    openapi:
      glob: "packages/backend/src/**"
      run: pnpm --filter @ai-english/backend openapi:gen && git add packages/backend/src/openapi.json && pnpm --filter @ai-english/backend exec vitest run src/routes/openapi-coverage.test.ts
      skip:
        - merge
        - rebase

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: pnpm -r typecheck
      fail_text: 全仓类型检查未通过，请修复类型错误后重试
    test:
      run: pnpm -r test
      fail_text: 单元测试未通过，请修复后重试
