server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # LLM 引擎 SSE 事件流：关缓冲/长读超时，保证状态变化事件实时达浏览器（需在 /api/ 之前匹配）
    location = /api/llm/stream {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态媒体文件仅三类前缀直连后端（锚定精确路径）：
    # 若写 location /files/ 会把前端路由 /files（文件管理页）当目录 301 补斜杠 → 丢宿主端口导致访问失败
    location ~ ^/files/(video|audio|bgm)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /doc {
        proxy_pass http://backend:8080;
    }

    # OpenAPI 规范 JSON（供 Scalar/Swagger/postman 等工具直接拉取；openapi:gen 生成入镜像）
    location = /openapi.json {
        proxy_pass http://backend:8080/doc;
    }

    location /health {
        proxy_pass http://backend:8080;
    }

    # 静态缓存策略：带内容 hash 的构建产物可永久缓存；index.html 必须 no-cache，
    # 否则重建发版后浏览器继续用缓存的旧 index.html → 引用旧 hash JS，新版本不生效（需手动强刷）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}