<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 90px 72px 80px;
  }
  .title { font-size: 34px; font-weight: 700; color: #1f2937; margin-bottom: 48px; }
  .story {
    font-size: {{FONT_SIZE}}px;
    line-height: 1.8;
    color: #111827;
    white-space: pre-wrap;
    word-break: break-word;
    letter-spacing: 0.5px;
    margin-bottom: 44px;
    flex: 1 1 auto;
    overflow: hidden;
  }
  .story p { margin-bottom: 0.6em; }
  .story p:last-child { margin-bottom: 0; }
  .story mark {
    background: #fbbf24;
    font-weight: 700;
    color: #111827;
    padding: 0 8px;
    border-radius: 8px;
  }
  .summary {
    background: #f3f4f6;
    border-radius: 20px;
    padding: 32px 40px;
  }
  .summary-title { font-size: 28px; font-weight: 700; color: #374151; margin-bottom: 24px; }
  .summary-words { display: flex; flex-wrap: wrap; gap: 20px 48px; }
  .summary-item { font-size: 30px; color: #111827; line-height: 1.5; }
  .summary-item .word { font-weight: 700; margin-right: 12px; }
</style>
</head>
<body>
  <div class="title">{{TITLE}}</div>
  <div class="story">{{TEXT}}</div>
  <div class="summary">
    <div class="summary-title">本期词汇</div>
    <div class="summary-words">{{SUMMARY_WORDS}}</div>
  </div>
</body>
</html>
